<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LR60 Trainer</title>
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LR60 Trainer">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1318">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}
/* lock screen, shown until the passphrase opens the app */
#lock{min-height:100vh;display:grid;place-items:center;background:#0d1318;color:#e3eaf0;padding:24px;box-sizing:border-box;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#lock form{width:100%;max-width:340px;display:grid;gap:14px}
#lock h1{font-size:26px;margin:0;letter-spacing:.02em}
#lock p{margin:0;color:#8d9ba7;font-size:14px}
#lock input[type=password]{font:17px inherit;padding:13px 12px;border-radius:6px;border:1px solid #27333e;background:#151e26;color:#e3eaf0;width:100%;box-sizing:border-box}
#lock label{display:flex;gap:8px;align-items:center;font-size:14px;color:#c4ced6}
#lock button{font:600 16px inherit;padding:13px;border-radius:6px;border:0;background:#3cc6e6;color:#06222b;cursor:pointer}
#lock #lockMsg{color:#ff8a80;min-height:1.4em}
</style>
</head>
<body>
<div id="lock">
  <form id="lockForm" autocomplete="off">
    <h1>LR60 Trainer</h1>
    <p>This copy is locked. Enter the passphrase to open it.</p>
    <input type="password" id="lockPass" aria-label="Passphrase" placeholder="Passphrase" autocomplete="current-password">
    <label><input type="checkbox" id="lockKeep" checked> Stay unlocked on this device</label>
    <button type="submit" id="lockGo">Unlock</button>
    <p id="lockMsg" role="alert"></p>
  </form>
</div>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const toB64 = (u) => btoa(String.fromCharCode.apply(null, u));
  const KEY = 'lr60.unlock';
  const get = () => { try { return localStorage.getItem(KEY); } catch (e) { return null; } };
  const set = (v) => { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch (e) {} };
  let pack = null;

  async function load() {
    if (!pack) pack = await (await fetch('app.enc.json')).json();
    return pack;
  }
  // PBKDF2-SHA256 gives 64 bytes: 32 for AES-256-CBC, 32 for the HMAC that proves the passphrase is right.
  async function derive(pass, p) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(p.salt), iterations: p.iter }, base, 512));
  }
  async function open(keys, p) {
    const iv = b64(p.iv), ct = b64(p.ct);
    const mk = await crypto.subtle.importKey('raw', keys.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
    const body = new Uint8Array(iv.length + ct.length); body.set(iv); body.set(ct, iv.length);
    if (!(await crypto.subtle.verify('HMAC', mk, b64(p.mac), body))) return null;
    const ek = await crypto.subtle.importKey('raw', keys.slice(0, 32), 'AES-CBC', false, ['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, ek, ct));
  }
  // The decrypted app is a page body: styles and markup go in as they are, scripts are re-created so they run in order.
  function start(html) {
    const t = document.createElement('template'); t.innerHTML = html;
    const scripts = [...t.content.querySelectorAll('script')]; scripts.forEach((s) => s.remove());
    $('lock').remove();
    document.body.appendChild(t.content);
    scripts.forEach((s) => { const n = document.createElement('script'); n.textContent = s.textContent; document.body.appendChild(n); });
  }
  async function tryKeys(keys, keep) {
    const html = await open(keys, await load());
    if (html == null) return false;
    if (keep) set(toB64(keys));
    start(html); return true;
  }

  $('lockForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = $('lockMsg'), go = $('lockGo'); msg.textContent = ''; go.disabled = true; go.textContent = 'Unlocking…';
    try {
      const p = await load();
      const ok = await tryKeys(await derive($('lockPass').value, p), $('lockKeep').checked);
      if (!ok) msg.textContent = 'That passphrase did not open it. Check it and try again.';
    } catch (err) {
      msg.textContent = 'Could not load the app. Connect to the internet once, then try again.';
    }
    go.disabled = false; go.textContent = 'Unlock';
  });

  // A device that chose to stay unlocked opens straight into the app, online or offline.
  (async () => {
    const saved = get(); if (!saved) return;
    try { if (!(await tryKeys(b64(saved), false))) set(null); } catch (e) {}
  })();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
})();
</script>
</body>
</html>
